<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="theme-color" content="#185FA5"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="POS"/>
<title>POS — ระบบขายหน้าร้าน</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --primary:#185FA5;--primary-light:#E6F1FB;
  --success:#1D9E75;--success-light:#E1F5EE;
  --danger:#E24B4A;--warning:#BA7517;
  --text:#1a1a1a;--text-muted:#6b7280;
  --bg:#fff;--bg2:#f5f5f0;--border:rgba(0,0,0,0.12);
  --radius:8px;--radius-lg:12px;
}
@media(prefers-color-scheme:dark){
  :root{--text:#f0f0f0;--text-muted:#9ca3af;--bg:#1c1c1e;--bg2:#2c2c2e;--border:rgba(255,255,255,0.15);}
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:var(--text);background:var(--bg2);}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
.topbar{background:var(--primary);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;}
.topbar .title{font-size:17px;font-weight:600;flex:1;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#fff;opacity:0.4;flex-shrink:0;}
.sync-dot.on{opacity:1;animation:blink 1.5s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}

/* Search */
.search-area{padding:10px 12px;background:var(--bg);border-bottom:0.5px solid var(--border);}
.search-bar{display:flex;gap:8px;}
.search-bar input{flex:1;padding:10px 14px;border:0.5px solid var(--border);border-radius:var(--radius);font-size:14px;background:var(--bg);color:var(--text);outline:none;}
.search-bar input:focus{border-color:var(--primary);}
.btn-icon{width:42px;height:42px;border:0.5px solid var(--border);border-radius:var(--radius);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text-muted);flex-shrink:0;}
.btn-icon.primary{background:var(--primary-light);color:var(--primary);border-color:var(--primary);}

/* Product grid */
.product-grid{padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;overflow-y:auto;flex:1;padding-bottom:16px;}
.p-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:12px;cursor:pointer;transition:all 0.1s;}
.p-card:active{background:var(--primary-light);border-color:var(--primary);transform:scale(0.97);}
.p-card.out{opacity:0.5;pointer-events:none;}
.p-card .pname{font-size:13px;font-weight:500;margin-bottom:4px;line-height:1.3;}
.p-card .pprice{font-size:16px;font-weight:700;color:var(--primary);}
.p-card .pstock{font-size:11px;color:var(--text-muted);margin-top:3px;}
.stock-low{color:var(--warning)!important;}
.stock-out{color:var(--danger)!important;}

/* Cart */
.cart-bar{background:var(--bg);border-top:0.5px solid var(--border);padding:0;}
.cart-header{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;}
.cart-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;}
.cart-badge{background:var(--primary);color:#fff;font-size:11px;padding:2px 8px;border-radius:20px;}
.cart-total{font-size:15px;font-weight:700;color:var(--primary);}
.cart-body{display:none;max-height:40vh;overflow-y:auto;border-top:0.5px solid var(--border);}
.cart-body.open{display:block;}
.cart-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:0.5px solid var(--border);}
.cart-item .ci-info{flex:1;min-width:0;}
.cart-item .ci-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cart-item .ci-price{font-size:11px;color:var(--text-muted);}
.cart-item .ci-qty{display:flex;align-items:center;gap:8px;}
.cart-item .ci-qty button{width:28px;height:28px;border-radius:50%;border:0.5px solid var(--border);background:var(--bg2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.cart-item .ci-qty span{font-size:15px;font-weight:600;min-width:24px;text-align:center;}
.cart-item .ci-sub{font-size:13px;font-weight:600;min-width:60px;text-align:right;}
.cart-actions{padding:10px 14px;display:flex;gap:8px;}
.btn-clear{flex:0 0 auto;padding:13px 16px;border:0.5px solid var(--border);border-radius:var(--radius);background:var(--bg2);cursor:pointer;font-size:13px;color:var(--text-muted);}
.btn-pay{flex:1;padding:14px;background:var(--success);color:#fff;border:none;border-radius:var(--radius);font-size:15px;cursor:pointer;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-pay:active{opacity:0.85;}
.btn-pay:disabled{opacity:0.4;pointer-events:none;}

/* Payment Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;display:none;align-items:flex-end;justify-content:center;}
.overlay.open{display:flex;}
.modal{background:var(--bg);border-radius:20px 20px 0 0;padding:20px 16px 36px;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 18px;}
.modal-title{font-size:17px;font-weight:600;margin-bottom:18px;}
.pay-summary{background:var(--bg2);border-radius:var(--radius);padding:14px;margin-bottom:16px;}
.pay-row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:14px;}
.pay-row.total{font-size:18px;font-weight:700;color:var(--success);border-top:0.5px solid var(--border);padding-top:10px;margin-top:4px;}
.pay-methods{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.pay-method{padding:14px;border:2px solid var(--border);border-radius:var(--radius);cursor:pointer;text-align:center;font-size:13px;font-weight:500;transition:all 0.15s;}
.pay-method.active{border-color:var(--primary);background:var(--primary-light);color:var(--primary);}
.pay-method i{display:block;font-size:24px;margin-bottom:4px;}
.form-group{margin-bottom:14px;}
.form-group label{font-size:12px;color:var(--text-muted);display:block;margin-bottom:5px;font-weight:500;}
.form-group input{width:100%;padding:11px 14px;border:0.5px solid var(--border);border-radius:var(--radius);font-size:16px;background:var(--bg);color:var(--text);outline:none;}
.form-group input:focus{border-color:var(--primary);}
.change-display{background:var(--success-light);border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;display:none;}
.change-display .cl{font-size:12px;color:#085041;}
.change-display .cv{font-size:24px;font-weight:700;color:#085041;}
.btn-confirm{width:100%;padding:15px;background:var(--success);color:#fff;border:none;border-radius:var(--radius);font-size:16px;cursor:pointer;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-confirm:disabled{opacity:0.4;pointer-events:none;}

/* Success */
.success-overlay{position:fixed;inset:0;background:rgba(29,158,117,0.95);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;}
.success-overlay.show{display:flex;}
.success-icon{font-size:72px;margin-bottom:16px;}
.success-total{font-size:42px;font-weight:700;margin-bottom:8px;}
.success-change{font-size:18px;opacity:0.9;margin-bottom:32px;}
.success-btn{padding:14px 40px;background:#fff;color:var(--success);border:none;border-radius:var(--radius);font-size:16px;cursor:pointer;font-weight:700;}

.toast{position:fixed;bottom:200px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(15,15,15,0.9);color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;opacity:0;transition:all 0.25s;pointer-events:none;z-index:300;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <i class="ti ti-device-desktop" style="font-size:22px"></i>
    <span class="title">POS — หน้าร้าน</span>
    <div class="sync-dot" id="sync-dot"></div>
  </div>

  <div class="search-area">
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="ค้นหาสินค้า..." oninput="filterProducts(this.value)"/>
      <button class="btn-icon primary" title="สแกน Barcode" onclick="toast('ใช้ช่องพิมพ์ด้านบนแทนได้ครับ')"><i class="ti ti-scan"></i></button>
    </div>
  </div>

  <div class="product-grid" id="product-grid">
    <div style="grid-column:span 2;text-align:center;padding:40px 0;color:var(--text-muted);">
      <i class="ti ti-loader" style="font-size:32px;"></i><br>กำลังโหลดข้อมูล...
    </div>
  </div>

  <!-- Cart -->
  <div class="cart-bar">
    <div class="cart-header" onclick="toggleCart()">
      <div class="cart-title">
        <i class="ti ti-shopping-cart"></i> ตะกร้า
        <span class="cart-badge" id="cart-count">0</span>
      </div>
      <div class="cart-total" id="cart-total-bar">฿0</div>
    </div>
    <div class="cart-body" id="cart-body">
      <div id="cart-items"></div>
      <div class="cart-actions">
        <button class="btn-clear" onclick="clearCart()"><i class="ti ti-trash"></i> ล้าง</button>
        <button class="btn-pay" id="pay-btn" onclick="openPayment()" disabled>
          <i class="ti ti-cash"></i> ชำระเงิน
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Payment Modal -->
<div class="overlay" id="ov-pay">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">ชำระเงิน</div>
    <div class="pay-summary" id="pay-summary"></div>
    <div class="pay-methods">
      <div class="pay-method active" onclick="setPayMethod('cash')" id="pm-cash">
        <i class="ti ti-cash"></i>เงินสด
      </div>
      <div class="pay-method" onclick="setPayMethod('transfer')" id="pm-transfer">
        <i class="ti ti-building-bank"></i>โอนเงิน
      </div>
    </div>
    <div id="cash-section">
      <div class="form-group">
        <label>รับเงินมา (บาท)</label>
        <input type="number" id="received" placeholder="0" oninput="calcChange()" inputmode="numeric"/>
      </div>
      <div class="change-display" id="change-display">
        <div class="cl">เงินทอน</div>
        <div class="cv" id="change-val">฿0</div>
      </div>
    </div>
    <button class="btn-confirm" id="confirm-btn" onclick="confirmPayment()" disabled>
      <i class="ti ti-check"></i> ยืนยันการชำระเงิน
    </button>
  </div>
</div>

<!-- Success Screen -->
<div class="success-overlay" id="success-screen">
  <div class="success-icon">✅</div>
  <div style="font-size:20px;margin-bottom:8px;">ชำระเงินสำเร็จ!</div>
  <div class="success-total" id="s-total"></div>
  <div class="success-change" id="s-change"></div>
  <button class="success-btn" onclick="newSale()">ขายรายการถัดไป</button>
</div>

<div class="toast" id="toast-el"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, update, push }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyC7bTnGpe8nuBLz3cM0Rh3PEQEE07szybw",
  authDomain: "stocksync-pos.firebaseapp.com",
  databaseURL: "https://stocksync-pos-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "stocksync-pos",
  storageBucket: "stocksync-pos.firebasestorage.app",
  messagingSenderId: "583916284708",
  appId: "1:583916284708:web:56e1425fd396fe9bc821b1"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let products = [];
let cart = []; // [{product, qty}]
let payMethod = 'cash';
let cartOpen = false;

// ====== FIREBASE ======
onValue(ref(db,'products'), snap=>{
  document.getElementById('sync-dot').classList.add('on');
  const data = snap.val();
  products = data ? Object.entries(data).map(([id,v])=>({...v,fireId:id})) : [];
  renderGrid();
  renderCart();
});

async function deductStock(items){
  for(const {product, qty} of items){
    const newQty = Math.max(0, product.qty - qty);
    await update(ref(db,`products/${product.fireId}`),{qty:newQty});
  }
  // บันทึกประวัติการขาย
  const total = items.reduce((s,i)=>s+i.product.price*i.qty,0);
  await push(ref(db,'history'),{
    type:'sale',
    name: items.length===1 ? items[0].product.name : `${items.length} รายการ`,
    qty: items.reduce((s,i)=>s+i.qty,0),
    note:`ยอดขาย ฿${total.toLocaleString()}`,
    ts: Date.now(),
    time: new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})
  });
}

// ====== RENDER PRODUCTS ======
function sc(p){return p.qty===0?'out':p.qty<p.min?'low':'ok';}
function stockText(p){
  if(p.qty===0) return `<span class="stock-out">หมดสต็อก</span>`;
  if(p.qty<p.min) return `<span class="stock-low">เหลือ ${p.qty} ${p.unit}</span>`;
  return `<span>เหลือ ${p.qty} ${p.unit}</span>`;
}

function renderGrid(list){
  const src = list||products;
  document.getElementById('product-grid').innerHTML = src.length ? src.map(p=>`
    <div class="p-card ${p.qty===0?'out':''}" onclick="addToCart('${p.fireId}')">
      <div class="pname">${p.name}</div>
      <div class="pprice">฿${p.price.toLocaleString()}</div>
      <div class="pstock">${stockText(p)}</div>
    </div>`).join('')
  : '<div style="grid-column:span 2;text-align:center;padding:40px 0;color:var(--text-muted);">ไม่พบสินค้า</div>';
}

window.filterProducts = function(q){
  renderGrid(q ? products.filter(p=>p.name.includes(q)||p.sku.includes(q)) : products);
};

// ====== CART ======
window.addToCart = function(fid){
  const p = products.find(x=>x.fireId===fid);
  if(!p||p.qty===0) return;
  const existing = cart.find(i=>i.product.fireId===fid);
  if(existing){
    if(existing.qty>=p.qty){toast(`สต็อกมีแค่ ${p.qty} ${p.unit}`);return;}
    existing.qty++;
  } else {
    cart.push({product:p, qty:1});
  }
  if(!cartOpen){cartOpen=true;document.getElementById('cart-body').classList.add('open');}
  renderCart();
  toast(`เพิ่ม ${p.name} ✓`);
};

window.removeFromCart = function(fid){
  cart = cart.filter(i=>i.product.fireId!==fid);
  renderCart();
};
window.changeCartQty = function(fid, d){
  const item = cart.find(i=>i.product.fireId===fid);
  if(!item) return;
  item.qty = Math.max(1, item.qty+d);
  if(item.qty > item.product.qty){ item.qty=item.product.qty; toast('สต็อกไม่พอ'); }
  renderCart();
};

function cartTotal(){ return cart.reduce((s,i)=>s+i.product.price*i.qty,0); }
function cartCount(){ return cart.reduce((s,i)=>s+i.qty,0); }

function renderCart(){
  const total = cartTotal();
  const count = cartCount();
  document.getElementById('cart-count').textContent = count;
  document.getElementById('cart-total-bar').textContent = '฿'+total.toLocaleString();
  document.getElementById('pay-btn').disabled = cart.length===0;
  document.getElementById('cart-items').innerHTML = cart.map(i=>`
    <div class="cart-item">
      <div class="ci-info">
        <div class="ci-name">${i.product.name}</div>
        <div class="ci-price">฿${i.product.price.toLocaleString()} / ${i.product.unit}</div>
      </div>
      <div class="ci-qty">
        <button onclick="changeCartQty('${i.product.fireId}',-1)">−</button>
        <span>${i.qty}</span>
        <button onclick="changeCartQty('${i.product.fireId}',1)">+</button>
      </div>
      <div class="ci-sub">฿${(i.product.price*i.qty).toLocaleString()}</div>
      <button class="btn-icon" style="width:32px;height:32px;font-size:16px;" onclick="removeFromCart('${i.product.fireId}')"><i class="ti ti-x"></i></button>
    </div>`).join('');
}

window.toggleCart = function(){
  cartOpen=!cartOpen;
  document.getElementById('cart-body').classList.toggle('open',cartOpen);
};
window.clearCart = function(){cart=[];renderCart();};

// ====== PAYMENT ======
window.openPayment = function(){
  if(cart.length===0) return;
  const total=cartTotal();
  // summary
  document.getElementById('pay-summary').innerHTML=`
    ${cart.map(i=>`<div class="pay-row"><span>${i.product.name} × ${i.qty}</span><span>฿${(i.product.price*i.qty).toLocaleString()}</span></div>`).join('')}
    <div class="pay-row total"><span>รวมทั้งหมด</span><span>฿${total.toLocaleString()}</span></div>`;
  document.getElementById('received').value='';
  document.getElementById('change-display').style.display='none';
  document.getElementById('confirm-btn').disabled=true;
  calcChange();
  document.getElementById('ov-pay').classList.add('open');
  setTimeout(()=>document.getElementById('received').focus(),300);
};

window.setPayMethod = function(m){
  payMethod=m;
  document.getElementById('pm-cash').classList.toggle('active',m==='cash');
  document.getElementById('pm-transfer').classList.toggle('active',m==='transfer');
  document.getElementById('cash-section').style.display=m==='cash'?'block':'none';
  document.getElementById('confirm-btn').disabled = m==='cash';
  if(m==='transfer') document.getElementById('confirm-btn').disabled=false;
};

window.calcChange = function(){
  const total=cartTotal();
  const received=parseFloat(document.getElementById('received').value)||0;
  const change=received-total;
  const cd=document.getElementById('change-display');
  const cb=document.getElementById('confirm-btn');
  if(received>=total){
    cd.style.display='block';
    document.getElementById('change-val').textContent='฿'+change.toLocaleString();
    cb.disabled=false;
  } else {
    cd.style.display='none';
    cb.disabled=true;
  }
};

window.confirmPayment = async function(){
  const total=cartTotal();
  const received=payMethod==='cash'?(parseFloat(document.getElementById('received').value)||0):total;
  const change=received-total;
  document.getElementById('ov-pay').classList.remove('open');
  // ตัดสต็อกใน Firebase
  await deductStock([...cart]);
  // แสดง success
  document.getElementById('s-total').textContent='฿'+total.toLocaleString();
  document.getElementById('s-change').textContent=payMethod==='cash'?`เงินทอน ฿${change.toLocaleString()}`:'โอนเงิน ✓';
  document.getElementById('success-screen').classList.add('show');
};

window.newSale = function(){
  cart=[];renderCart();
  cartOpen=false;document.getElementById('cart-body').classList.remove('open');
  document.getElementById('success-screen').classList.remove('show');
  document.getElementById('search-input').value='';
  renderGrid();
};

window.toast=function(msg){const t=document.getElementById('toast-el');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);};
document.querySelectorAll('.overlay').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open');}));
</script>
</body>
</html>
